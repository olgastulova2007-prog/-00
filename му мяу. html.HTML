<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Какая ты должность?</title>
<style>
    * { box-sizing: border-box; }
    body {
        font-family: 'Segoe UI', Arial, sans-serif;
        background: linear-gradient(135deg, #ff9a3c 0%, #ff6a00 100%);
        min-height: 100vh;
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: flex-start;
    }
    .container {
        background: #fff;
        border-radius: 16px;
        padding: 30px 35px;
        max-width: 650px;
        width: 100%;
        box-shadow: 0 20px 60px rgba(200, 80, 0, 0.35);
        margin-top: 20px;
        border-top: 8px solid #ff6a00;
    }
    h1 {
        text-align: center;
        color: #ff6a00;
        font-size: 26px;
        margin-top: 0;
    }
    .question {
        margin: 22px 0;
        padding: 18px;
        border: 2px solid #ffe0c2;
        border-radius: 10px;
        background: #fff8f0;
    }
    .question p {
        margin: 0 0 12px;
        font-weight: 600;
        color: #333;
    }
    .option {
        display: flex;
        align-items: center;
        padding: 8px 10px;
        margin: 5px 0;
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.15s;
    }
    .option:hover { background: #ffe9d4; }
    .option input { margin-right: 10px; cursor: pointer; accent-color: #ff6a00; }
    button {
        width: 100%;
        padding: 14px;
        font-size: 17px;
        font-weight: 700;
        color: #fff;
        background: #ff6a00;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        margin-top: 10px;
        transition: background 0.2s;
    }
    button:hover { background: #e65c00; }
    #result {
        margin-top: 25px;
        padding: 30px 20px;
        border-radius: 10px;
        background: #fff3e6;
        border: 2px solid #ffb870;
        display: none;
        text-align: center;
    }
    #result .label {
        font-size: 16px;
        color: #a14a00;
        margin: 0;
    }
    #result .winner {
        font-size: 32px;
        font-weight: 800;
        color: #ff6a00;
        margin: 15px 0 5px;
    }
    .warning {
        color: #c0392b;
        font-weight: 600;
        text-align: center;
        margin-top: 15px;
    }
</style>
</head>
<body>
<div class="container">
    <h1>Какая ты должность?</h1>
    <form id="quiz"></form>
    <button onclick="checkAnswers()">Показать результат</button>
    <div id="result"></div>
</div>

<script>
// Итоговые должности
const positions = {
    priest: "Жрец 🔮",
    teacher: "Преподаватель 📚",
    slave: "Раб ⛓️",
    healer: "Лекарь 💊",
    monkey: "Обезьяна 🐒"
};

// 5 вопросов
const questions = [
    {
        q: "Вам комфортно работать с людьми?",
        options: [
            { text: "Да", points: { priest: 1, teacher: 2, healer: 2 } },
            { text: "Нет", points: { slave: 1, monkey: 2 } }
        ]
    },
    {
        q: "Вам нравится управлять людьми или направлять их?",
        options: [
            { text: "Управлять", points: { priest: 2, teacher: 1 } },
            { text: "Направлять", points: { teacher: 2, healer: 1 } },
            { text: "Я не хочу связываться с людьми", points: { slave: 2, monkey: 1 } }
        ]
    },
    {
        q: "Тебе важен статус?",
        options: [
            { text: "Да", points: { priest: 2, teacher: 1 } },
            { text: "Нет", points: { slave: 2, monkey: 1, healer: 1 } }
        ]
    },
    {
        q: "Вам нравится изучать различные науки?",
        options: [
            { text: "Да, люблю гуманитарные", points: { priest: 2, teacher: 2 } },
            { text: "Да, люблю технические", points: { healer: 2, monkey: 1 } },
            { text: "Да, люблю естественнонаучные", points: { healer: 3 } },
            { text: "Нет, я неуч", points: { slave: 2, monkey: 2 } }
        ]
    },
    {
        q: "Какой стиль работы вам ближе?",
        options: [
            { text: "Помогать и лечить людей", points: { healer: 3 } },
            { text: "Учить и наставлять", points: { teacher: 3 } },
            { text: "Вести за собой, быть авторитетом", points: { priest: 3 } },
            { text: "Просто делать, что скажут", points: { slave: 3 } },
            { text: "Дурачиться и получать удовольствие", points: { monkey: 3 } }
        ]
    }
];

// Рендер формы
const form = document.getElementById('quiz');
questions.forEach((item, i) => {
    const div = document.createElement('div');
    div.className = 'question';
    div.innerHTML = `<p>${i + 1}. ${item.q}</p>`;
    item.options.forEach((opt, j) => {
        div.innerHTML += `
            <label class="option">
                <input type="radio" name="q${i}" value="${j}">
                ${opt.text}
            </label>`;
    });
    form.appendChild(div);
});

function checkAnswers() {
    const scores = {};
    Object.keys(positions).forEach(k => scores[k] = 0);

    // Проверка, что все вопросы отвечены
    for (let i = 0; i < questions.length; i++) {
        const selected = document.querySelector(`input[name="q${i}"]:checked`);
        if (!selected) {
            const res = document.getElementById('result');
            res.style.display = 'block';
            res.innerHTML = `<p class="warning">⚠️ Пожалуйста, ответьте на все вопросы!</p>`;
            return;
        }
    }

    // Начисление баллов
    questions.forEach((item, i) => {
        const selected = document.querySelector(`input[name="q${i}"]:checked`);
        const points = item.options[Number(selected.value)].points;
        for (const cat in points) {
            scores[cat] += points[cat];
        }
    });

    // Победитель (при ничьей берём случайного из лидеров)
    const maxScore = Math.max(...Object.values(scores));
    const winners = Object.keys(scores).filter(k => scores[k] === maxScore);
    const winner = winners[Math.floor(Math.random() * winners.length)];

    const res = document.getElementById('result');
    res.style.display = 'block';
    res.innerHTML = `
        <p class="label">Твоя должность:</p>
        <div class="winner">${positions[winner]}</div>
    `;
    res.scrollIntoView({ behavior: 'smooth' });
}
</script>
</body>
</html>
